[project]
name = "askdb"
version = "0.1.0"
description = "Natural-language to SQL agent: validated, read-only, self-correcting."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "sqlglot>=30.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
askdb = "askdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["askdb", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
